spring:
  application:
    name: ins
  datasource:
    url: jdbc:postgresql://localhost:5432/ner_db
    username: postgres
    password: postgres
  ai:
    mcp:
      server:
        enabled: true
        name: MCP-NER
        version: 0.0.1
        type: SYNC
    model:
      chat: openai
#    ollama:
#      base-url: http://localhost:11434
#      chat:
#        options:
#          model: gpt-oss:20b
#          temperature: 0.1
#      embedding:
#        options:
#          model: nomic-embed-text
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4.1-nano
          temperature: 0.1
      embedding:
        options:
          model: text-embedding-3-small  # 1536 dims
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
        index-type: hnsw
        distance-type: cosine_distance
api:
  layout:
    enabled: false
  validation:
    url: http://localhost:8080/api/foreign-service/stub

mailgen:
  templateLocation: "classpath:templates"
  defaultOnMissing: "LEAVE"                        # LEAVE | EMPTY | ERROR
  defaultLineEndings: "LF"                         # LF | CRLF
